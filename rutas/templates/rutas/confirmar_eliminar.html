{% extends 'base.html' %}
{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<h1>¿Confirmas eliminar la ruta "{{ ruta.origen }} ➔ {{ ruta.destino }}"?</h1>
<p>Esta acción eliminará el registro permanentemente de la base de datos.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" style="padding: 10px 20px; background: red; color: white; border: none; cursor: pointer;">Sí, Eliminar</button>
    <a href="{% url 'rutas:horarios' %}" style="margin-left: 10px;">Cancelar</a>
</form>
{% endblock %}
