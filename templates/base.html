<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Conectividad Marítima - Los Lagos{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        nav { background: #004080; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; font-weight: bold; }
        .card { background: white; padding: 15px; border-radius: 5px; margin-bottom: 10px; border-left: 5px solid #004080; }
        .module-card {
            padding: 22px;
            border-left-width: 6px;
            box-shadow: 0 2px 8px rgba(21, 59, 80, 0.08);
            font-family: Arial, sans-serif;
        }
        .module-card * { font-family: inherit; }
        .module-card-flota { border-left-color: #004080; }
        .module-card-rutas { border-left-color: #087e8b; }
        .module-card-terminales { border-left-color: #69aebd; }
        .module-card h2,
        .module-card h3 {
            color: #153b50;
            font-size: 1.25rem;
            line-height: 1.3;
        }
        .module-card p { font-size: 1rem; line-height: 1.5; }
        .module-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-items: start;
            margin-top: 16px;
        }
        .module-grid > .module-card {
            width: 100%;
            box-sizing: border-box;
            margin: 0;
        }
        @media (max-width: 600px) {
            body { padding: 12px; }
            nav { margin-bottom: 16px; }
            nav a { display: inline-block; margin: 4px 12px 4px 0; }
            .module-card { padding: 17px; }
            .module-grid { grid-template-columns: 1fr; gap: 12px; }
        }
        .alert { color: red; font-weight: bold; }
        .ok { color: green; font-weight: bold; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <nav>
        <a href="{% url 'rutas:inicio' %}">Inicio</a>
        <a href="{% url 'flota:lista_embarcaciones' %}">Flota y Barcazas</a>
        <a href="{% url 'rutas:horarios' %}">Rutas y Horarios</a>
        <a href="{% url 'terminales:lista' %}">Puertos y Rampas</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer style="margin-top: 40px; color: #666; font-size: 0.9em;">
        <p>&copy; 2026 Conectividad Marítima Región de Los Lagos - Sistema de Información</p>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
